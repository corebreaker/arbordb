[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/corebreaker/arbordb"
readme = "README.md"

[workspace.dependencies]
arbordb-derive = { path = "crates/arbordb-derive", version = "0.0" }

num-bigint = "0.4"
num-bigfloat = "1.7"
num-rational = "0.4"
redb = "4.1"

[workspace.metadata.scripts]
fmt = "cargo +nightly fmt --all"
gc = "cargo sweep -r -t 10 ."
bench = "cargo bench -p arbordb --features derive"
bench-reports = "cargo bench -p arbordb --features derive --features criterion/html_reports,criterion/plotters,criterion/rayon"
